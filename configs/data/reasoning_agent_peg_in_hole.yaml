# Peg-in-hole color/shape (offline / annotation).

extends: _base

output:
  root: outputs
  log_dir: outputs/logs

task:
  name: peg_in_hole
  semantic_intent_injection: both
  model_input_resolution: [224, 224]
  output_resolution: [224, 224]

dataset:
  task_context:
    source: jsonl
    path: meta/episode_prompts.jsonl
    instruction_field: instruction
    fields: [selected_block_color, selected_peg_shape]
    required: true
    task_position: 0
    write_to_lerobot: false

subtask:
  enabled: true
  advance_on_return_to: free_move
  completion_stages: [dexterous_contact, transport_contact]

stage_source:
  mode: annotation

stage_aware:
  enabled: true
  global_render_mode: block_mask
  stage_stability_frames: 1
  free_move_grounding_delay_frames: 30
  skip_stages: [dexterous_contact]

stages:
  ids:
    4:
      name: dexterous_contact
      cameras: [right_wrist]
      prompt: "the insertion target"
    5:
      name: dexterous_contact
      cameras: [left_wrist]
      prompt: "the insertion target"

grounding:
  reset_detector: qwen
  grounder: qwen
  qwen:
    max_new_tokens: 64
    output_mode: json
    board_pad: 6
  box_threshold: 0.22
  text_threshold: 0.18
  max_box_area_ratio: 0.5
  keep_top_k: 1
  reground_on_prompt_change: true
  invalidate_non_primary_on_lost: true
  min_mask_area_ratio: 0.001
  verify_wrist_target: false
  ground_every_step: false

tracker:
  backend: sam2_memory
  staged_model_loading: true
  memory_frames: 24
